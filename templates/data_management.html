<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能瞭望 - 数据管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">智能瞭望系统</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">数据采集</a>
            <a href="{{ url_for('data_management') }}" class="active">数据管理</a>
            <a href="{{ url_for('logout') }}">退出</a>
        </div>
    </nav>

    <div class="main-container">
        <section class="filter-section">
            <h2>数据仓库管理</h2>
            <form method="GET" action="{{ url_for('data_management') }}" class="filter-form">
                <div class="form-group-inline">
                    <label>关键词检索：</label>
                    <input type="text" name="keyword" value="{{ request.args.get('keyword', '') }}" placeholder="搜索标题或关键词...">
                </div>
                <div class="form-group-inline">
                    <label>日期归类：</label>
                    <input type="date" name="date" value="{{ request.args.get('date', '') }}">
                </div>
                <button type="submit" class="btn-filter">筛选</button>
                <a href="{{ url_for('data_management') }}" class="btn-reset">重置</a>
            </form>
        </section>

        <section class="data-table-section">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="5%"><input type="checkbox" id="select-all-data"></th>
                        <th width="10%">采集日期</th>
                        <th width="10%">关键词</th>
                        <th width="25%">标题</th>
                        <th width="35%">概要</th>
                        <th width="15%">操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in saved_data %}
                    <tr>
                        <td><input type="checkbox" class="data-checkbox" value="{{ item.id }}"></td>
                        <td>{{ item.created_at.strftime('%Y-%m-%d') }}</td>
                        <td>{{ item.keyword }}</td>
                        <td><a href="{{ item.url }}" target="_blank">{{ item.title }}</a></td>
                        <td class="cell-summary" title="{{ item.summary }}">{{ item.summary }}</td>
                        <td>
                            <a href="{{ item.url }}" target="_blank" class="btn-small">查看原始</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" style="text-align:center;">暂无数据</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>

        <section class="ai-actions-section">
            <h3>AI 数据提炼</h3>
            <p class="hint">请选择数据后生成报告（功能待开发）</p>
            <button class="btn-ai" disabled>生成 AI 分析报告</button>
            <button class="btn-pdf" disabled>导出 PDF</button>
        </section>
    </div>
</body>
</html>
