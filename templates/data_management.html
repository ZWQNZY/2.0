<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能瞭望 - 数据管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">智能瞭望系统</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">数据采集</a>
            <a href="{{ url_for('data_management') }}" class="active">数据管理</a>
            <a href="{{ url_for('logout') }}">退出</a>
        </div>
    </nav>

    <div class="main-container">
        <section class="filter-section">
            <h2>数据仓库管理</h2>
            <form method="GET" action="{{ url_for('data_management') }}" class="filter-form">
                <div class="form-group-inline">
                    <label>关键词检索：</label>
                    <input type="text" name="keyword" value="{{ request.args.get('keyword', '') }}" placeholder="搜索标题或关键词...">
                </div>
                <div class="form-group-inline">
                    <label>日期归类：</label>
                    <input type="date" name="date" value="{{ request.args.get('date', '') }}">
                </div>
                <button type="submit" class="btn-filter">筛选</button>
                <a href="{{ url_for('data_management') }}" class="btn-reset">重置</a>
            </form>
        </section>

        <section class="data-table-section">
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="5%"><input type="checkbox" id="select-all-data"></th>
                        <th width="10%">采集日期</th>
                        <th width="10%">关键词</th>
                        <th width="40%">标题</th>
                        <th width="20%">采集和嗅探规则</th>
                        <th width="15%" style="text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in saved_data %}
                    <tr id="row-{{ item.id }}">
                        <td><input type="checkbox" class="data-checkbox" value="{{ item.id }}"></td>
                        <td>{{ item.created_at.strftime('%Y-%m-%d') }}</td>
                        <td>{{ item.keyword }}</td>
                        <td title="{{ item.title }}">
                            <a href="{{ item.url }}" target="_blank" class="result-title">{{ item.title }}</a>
                            <div class="result-domain">{{ item.domain }}</div>
                        </td>
                        <td>百度全网搜索</td>
                        <td class="col-actions">
                            <button class="btn-small btn-collect" onclick="startCollect('{{ item.id }}')">采集</button>
                            <button class="btn-small btn-sniff" onclick="startSniff('{{ item.id }}')">嗅探</button>
                            <a href="{{ item.url }}" target="_blank" class="btn-small btn-view-origin">查看</a>
                            <button class="btn-small btn-delete" onclick="deleteItem('{{ item.id }}')">删除</button>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" style="text-align:center;">暂无数据</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>

        <section class="ai-actions-section">
            <h3>AI 数据提炼</h3>
            <p class="hint">请选择数据后生成报告（功能待开发）</p>
            <button class="btn-ai" disabled>生成 AI 分析报告</button>
            <button class="btn-pdf" disabled>导出 PDF</button>
        </section>
    </div>

    <!-- Sniff Result Modal -->
    <div id="sniffModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>嗅探结果与规则配置</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="rule-section">
                    <h4>爬虫规则配置</h4>
                    <form id="ruleForm">
                        <div class="form-group">
                            <label>规则名称:</label>
                            <input type="text" id="rule_name" placeholder="为该规则命名">
                        </div>
                        <div class="form-group">
                            <label>域名 (Domain):</label>
                            <input type="text" id="rule_domain" readonly>
                        </div>
                        <div class="form-group">
                            <label>标题 XPath:</label>
                            <input type="text" id="rule_title_xpath">
                        </div>
                        <div class="form-group">
                            <label>内容 XPath:</label>
                            <input type="text" id="rule_content_xpath">
                        </div>
                        <div class="form-group">
                            <label>请求头 (Headers JSON):</label>
                            <textarea id="rule_headers" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                
                <div class="resource-section">
                    <h4>发现的媒体资源</h4>
                    <div id="resourceList" class="resource-list">
                        <p>暂无资源</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="saveRule()">保存规则</button>
            </div>
        </div>
    </div>

    <script>
        // Modal Logic
        const modal = document.getElementById("sniffModal");
        
        function closeModal() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        function startCollect(id) {
            const btn = document.querySelector(`#row-${id} .btn-collect`);
            const originalText = btn.innerText;
            btn.innerText = "采集...";
            btn.disabled = true;

            fetch('/collect_result/' + id, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('采集成功！');
                    btn.innerText = "已采集";
                } else {
                    alert('采集失败: ' + data.message);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('采集请求出错');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function startSniff(id) {
            const btn = document.querySelector(`#row-${id} .btn-sniff`);
            const originalText = btn.innerText;
            btn.innerText = "嗅探...";
            btn.disabled = true;

            fetch('/sniff_result/' + id, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                btn.innerText = originalText;
                btn.disabled = false;

                if (data.status === 'success') {
                    // Populate Modal
                    if (data.rule) {
                        document.getElementById('rule_name').value = data.rule.rule_name || "";
                        document.getElementById('rule_domain').value = data.rule.domain || "";
                        document.getElementById('rule_title_xpath').value = data.rule.title_xpath || "";
                        document.getElementById('rule_content_xpath').value = data.rule.content_xpath || "";
                        document.getElementById('rule_headers').value = data.rule.headers || "";
                    }
                    
                    const resList = document.getElementById('resourceList');
                    resList.innerHTML = "";
                    if (data.resources && data.resources.length > 0) {
                        data.resources.forEach(res => {
                            const p = document.createElement('p');
                            p.innerHTML = `<span class="badge ${res.type}">${res.type}</span> <a href="${res.url}" target="_blank">${res.url}</a>`;
                            resList.appendChild(p);
                        });
                    } else {
                        resList.innerHTML = "<p>未嗅探到明显的音视频资源。</p>";
                    }
                    
                    modal.style.display = "block";
                } else {
                    alert('嗅探失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('嗅探请求出错');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        function saveRule() {
            const data = {
                rule_name: document.getElementById('rule_name').value,
                domain: document.getElementById('rule_domain').value,
                title_xpath: document.getElementById('rule_title_xpath').value,
                content_xpath: document.getElementById('rule_content_xpath').value,
                headers: document.getElementById('rule_headers').value
            };
            
            fetch('/save_rule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    alert('规则保存成功！');
                    closeModal();
                } else {
                    alert('保存失败: ' + res.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert('保存请求出错');
            });
        }

        function deleteItem(id) {
            if (confirm('确定要删除这条数据吗？')) {
                fetch('/delete_result/' + id, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('row-' + id).remove();
                    } else {
                        alert('删除失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('操作失败');
                });
            }
        }
    </script>
</body>
</html>
